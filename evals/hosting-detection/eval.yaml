capability: hosting-detection
scenario: Inspect evaluated .NET 10 projects with Host factories, IServiceCollection lifetime registrations, configuration sections/binding, options registration/binding, HttpClientFactory typed/named registrations, installed-but-unused packages, dynamic/reflection-only wiring and two independent containers.
expected: Report static Host/DI/configuration/options/logging and HttpClientFactory registration facts with source locations. Preserve absent versus unknown; resolved Microsoft.Extensions 10 is supported, other versions remain unknown. Package installation and duplicate containers do not prove one shared runtime host/container or runtime options resolution. Logging composition includes service registration, host callbacks and provider/builder configuration; logger use alone does not prove composition. Typed/named HTTP facts prove registration shape only, not client use or active configuration.
safety: Use synthetic source and temporary repository fixtures; no runtime host, UI or model execution.
hosted_services: Resolved BackgroundService/IHostedService with AddHostedService or singleton interface registration; unregistered and name-only types remain absent, unresolved and unsupported inputs unknown. The shutdown-defect fixture confirms registration only, never cancellation correctness.
