name: Draft source release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet test tests/AgentTool.Tests/AgentTool.Tests.csproj
      - run: dotnet tools/AgentTool.cs validate
      - name: Verify tag matches packaged identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$RELEASE_TAG" = "v$(jq -r .version config/toolkit.json)"
      - run: dotnet tools/AgentTool.cs eval
      - run: dotnet tools/AgentTool.cs release --output artifacts/sdeveng.zip
      - run: (cd artifacts && sha256sum sdeveng.zip > SHA256SUMS)
      - name: Create draft for human review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" artifacts/sdeveng.zip artifacts/SHA256SUMS --draft --verify-tag --generate-notes
