name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 7 * * 2'
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  analyze:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
      - run: dotnet build tests/SdevEng.Tests/SdevEng.Tests.csproj --no-incremental -p:UseSharedCompilation=false
      - uses: github/codeql-action/analyze@v4
  unavailable:
    if: github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - run: echo "CodeQL code scanning is unavailable for this private repository; CI and dependency audit remain required."
